# The split relay of the Tandem image, runnable on one machine (LLD-relay §6): PostgreSQL holding the
# outbox, a single-node Kafka, and two relay replicas sharing the work under LEASE coordination.
#
# Build the image first, then start everything and wait until both relays report ready:
#
#   ./gradlew :tandem-relay:pinnedBootJar
#   docker build $(./gradlew -q :tandem-relay:imageBuildArgs) --tag tandem-relay:local apps/tandem-relay
#   docker compose -f apps/tandem-relay/docker-compose.example.yml up --wait
#
# To run a released image instead, set TANDEM_RELAY_IMAGE (ghcr.io/alirux/tandem-relay:<version>).
# Readiness and the Prometheus scrape of each replica are published on the host's loopback only:
# relay-1 on 8081, relay-2 on 8082. Stop with `docker compose -f ... down -v`.
#
# The Admin API is left off: it is an unauthenticated surface that the image warns about at every start
# (LLD-relay §4.2). Turning it on is TANDEM_ADMIN_ENABLED: "true" plus a published 8080 on one replica.

name: tandem-relay-example

x-relay: &relay
  image: ${TANDEM_RELAY_IMAGE:-tandem-relay:local}
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  # SIGTERM drains the relay: the workers finish their cycle, then the producer waits for the sends in
  # flight, up to delivery.timeout.ms. 60s covers both; Docker's default of 10s would cut it short with a
  # kill (LLD-relay §6.1).
  stop_grace_period: 60s
  healthcheck:
    # The readiness group, never the root health path, which also queries the database on every call.
    # The image carries no curl or wget, and gains none for a probe: bash's /dev/tcp sends the request.
    # Kubernetes needs none of this, its httpGet probe runs outside the container.
    test:
      - CMD
      - bash
      - -c
      - >-
        exec 3<>/dev/tcp/127.0.0.1/8081
        && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
        && head -n 1 <&3 | grep -q ' 200 '
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 90s
    start_interval: 2s

x-relay-environment: &relay-environment
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
  SPRING_DATASOURCE_USERNAME: tandem
  SPRING_DATASOURCE_PASSWORD: tandem
  TANDEM_KAFKA_SOURCE: /tandem/relay-example
  # Lands in the producer map as bootstrap.servers: any Kafka producer setting is reachable the same way.
  TANDEM_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:9092
  # More than one relay instance, so LEASE; the image keeps the library's default, SINGLE.
  TANDEM_RELAY_COORDINATION: LEASE
  # A row written into a quiet bucket is claimed at once instead of at the next poll. The write side must
  # emit the same wakeup, or nothing is ever signalled and the relay simply keeps polling.
  TANDEM_OUTBOX_WAKEUP: pg-notify

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem
    volumes:
      # The database applies the schema on its first start; the relay never does (LLD-relay §6.4).
      - ../../schema/postgres/tandem-baseline.sql:/docker-entrypoint-initdb.d/tandem-baseline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username tandem --dbname orders"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 3s

  relay-1:
    <<: *relay
    environment:
      <<: *relay-environment
      # Unique per replica: under LEASE two instances sharing an id would both believe they own the same
      # buckets. On Kubernetes, the pod name through the downward API.
      TANDEM_RELAY_INSTANCE_ID: relay-1
    ports:
      - "127.0.0.1:8081:8081"

  relay-2:
    <<: *relay
    environment:
      <<: *relay-environment
      TANDEM_RELAY_INSTANCE_ID: relay-2
    ports:
      - "127.0.0.1:8082:8081"
