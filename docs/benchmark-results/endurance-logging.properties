# java.util.logging config for an ENDURANCE run (S9), where the harness's own default is unusable.
#
# `tandem-benchmark/src/main/resources/logging.properties` raises com.codingful.tandem to FINE so the
# relay's per-cycle claim logging is visible — the right choice for a run measured in minutes, and a
# load of its own over a night: at 16 workers polling every 100 ms it is millions of lines, and the
# log write lands inside the measurement it is supposed to observe. Everything here is INFO, which
# keeps exactly what an endurance run needs (the window lines, lease events, and any WARNING/SEVERE)
# and drops the per-cycle chatter.
#
# Used with the installed distribution rather than the `loadTest` Gradle task, which pins the FINE
# file (LLD-benchmark §9):
#
#   ./gradlew :tandem-benchmark:installDist
#   JAVA_OPTS="-Djava.util.logging.config.file=$PWD/docs/benchmark-results/endurance-logging.properties" \
#     nohup caffeinate -ims tandem-benchmark/build/install/tandem-benchmark/bin/tandem-benchmark \
#     --duration=21600 --window=1200 --rate=400 --connections=52 \
#     --retention=600 --cleanup-interval=30 --cleanup-batch=20000 S9 > s9.log 2>&1 &
#
# Run it from the repository root: TandemTestContainer finds schema/postgres/tandem-baseline.sql by
# walking up from the working directory.
handlers=java.util.logging.ConsoleHandler
.level=INFO
com.codingful.tandem.level=INFO
java.util.logging.ConsoleHandler.level=INFO
# %6$s is the thrown exception. Without it the formatter silently drops every stack trace, so a
# logger call that correctly passes its Throwable (AGENTS.md logging rule 1) still prints a bare
# message — which is how a night of "Cleanup failed" once arrived with no cause attached, and the
# reason had to be recovered from PostgreSQL's own log.
java.util.logging.SimpleFormatter.format=%1$tH:%1$tM:%1$tS %4$-7s %3$s - %5$s%6$s%n
