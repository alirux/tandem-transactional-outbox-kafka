<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="440" viewBox="0 0 1320 440" role="img" aria-label="COMMIT to ack latency at 600 events per second: p50 12.6, p95 45.9, p99 87.0 and p99.9 231.6 milliseconds, with the spread between three runs shown as a whisker.">
