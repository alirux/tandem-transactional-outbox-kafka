  <text x="40.0" y="518.0" font-size="12" fill="#44536E" text-anchor="start">† the first window also contains container start and JIT warm-up.  Disk does reach ~97% briefly elsewhere in the run, on PostgreSQL checkpoint flushes — but not at these rates.</text>
