<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="540" viewBox="0 0 1320 540" role="img" aria-label="CPU and disk utilisation by offered rate. CPU rises with the rate to 94 percent where the ceiling sits and 94 percent at the rate that failed, while disk utilisation stays below 10 percent throughout.">
