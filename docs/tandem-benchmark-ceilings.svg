<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-label="The same measurement, three times on one machine: run 1 reached 1450 events per second, run 2 only 725, run 3 1450 again. Run 2 began immediately after run 1 had spent fifteen minutes at high CPU on a burstable instance.">
  <style>
    <![CDATA[
    text{ font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
    .mono{ font-family:Menlo,"DejaVu Sans Mono",monospace; }
    ]]>
  </style>
  <rect x="0" y="0" width="1320" height="520" rx="18" fill="#080A0F"/>
  <rect x="40" y="58" width="1240" height="444" rx="12" fill="#0D1119" stroke="#212B3B" stroke-width="2"/>
  <text x="40.0" y="52.0" font-size="21" fill="#E6EDF7" text-anchor="start" font-weight="bold">The ceiling is not a property of the software here</text>
  <text x="40.0" y="76.0" font-size="14" fill="#7E8CA8" text-anchor="start">Same machine, same code, three measurements — each one internally precise</text>
  <line x1="150.0" y1="130" x2="150.0" y2="424" stroke="#212B3B" stroke-width="1"/>
  <text x="150.0" y="450.0" class="mono" font-size="13" fill="#7E8CA8" text-anchor="middle">0</text>
  <line x1="390.0" y1="130" x2="390.0" y2="424" stroke="#212B3B" stroke-width="1"/>
  <text x="390.0" y="450.0" class="mono" font-size="13" fill="#7E8CA8" text-anchor="middle">400</text>
  <line x1="630.0" y1="130" x2="630.0" y2="424" stroke="#212B3B" stroke-width="1"/>
  <text x="630.0" y="450.0" class="mono" font-size="13" fill="#7E8CA8" text-anchor="middle">800</text>
  <line x1="870.0" y1="130" x2="870.0" y2="424" stroke="#212B3B" stroke-width="1"/>
  <text x="870.0" y="450.0" class="mono" font-size="13" fill="#7E8CA8" text-anchor="middle">1200</text>
  <line x1="1110.0" y1="130" x2="1110.0" y2="424" stroke="#212B3B" stroke-width="1"/>
  <text x="1110.0" y="450.0" class="mono" font-size="13" fill="#7E8CA8" text-anchor="middle">1600</text>
  <text x="132.0" y="184.0" class="mono" font-size="15" fill="#E6EDF7" text-anchor="end" font-weight="bold">run 1</text>
  <rect x="150" y="166.0" width="870.0" height="26" rx="4" fill="#3987E5"/>
  <rect x="1020.0" y="166.0" width="30.0" height="26" fill="#E03A1A" fill-opacity="0.35"/>
  <text x="1064.0" y="184.0" class="mono" font-size="17" fill="#E6EDF7" text-anchor="start" font-weight="bold">1450</text>
  <text x="1116.0" y="184.0" font-size="12.5" fill="#7E8CA8" text-anchor="start">held, 1500 did not</text>
  <text x="132.0" y="282.0" class="mono" font-size="15" fill="#E6EDF7" text-anchor="end" font-weight="bold">run 2</text>
  <rect x="150" y="264.0" width="435.0" height="26" rx="4" fill="#3987E5"/>
  <rect x="585.0" y="264.0" width="15.0" height="26" fill="#E03A1A" fill-opacity="0.35"/>
  <text x="614.0" y="282.0" class="mono" font-size="17" fill="#E6EDF7" text-anchor="start" font-weight="bold">725</text>
  <text x="666.0" y="282.0" font-size="12.5" fill="#7E8CA8" text-anchor="start">held, 750 did not</text>
  <text x="164.0" y="303.0" font-size="12.5" fill="#E03A1A" text-anchor="start">started minutes after run 1 finished — the only one that did</text>
  <text x="132.0" y="380.0" class="mono" font-size="15" fill="#E6EDF7" text-anchor="end" font-weight="bold">run 3</text>
  <rect x="150" y="362.0" width="870.0" height="26" rx="4" fill="#3987E5"/>
  <rect x="1020.0" y="362.0" width="30.0" height="26" fill="#E03A1A" fill-opacity="0.35"/>
  <text x="1064.0" y="380.0" class="mono" font-size="17" fill="#E6EDF7" text-anchor="start" font-weight="bold">1450</text>
  <text x="1116.0" y="380.0" font-size="12.5" fill="#7E8CA8" text-anchor="start">held, 1500 did not</text>
  <text x="40.0" y="490.0" font-size="12" fill="#44536E" text-anchor="start">Blue = the highest rate that held its backlog flat.  Red = the bracket between it and the first rate that did not.</text>
</svg>
