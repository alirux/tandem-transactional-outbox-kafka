<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560" role="img"
     aria-label="Three order events moving through Tandem: commit, tandem_outbox, relay claim, Kafka publish. One event is blocked after a failure while the other two, sharing its bucket, keep flowing.">
  <style>
    <![CDATA[
    text{ font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
    .mono{ font-family:Menlo,"DejaVu Sans Mono",monospace; }

    .card{ animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
    .lbl{ opacity:0; animation-timing-function:linear; animation-iteration-count:infinite; }

    /* Lane 1 — order-4471, a clean run through all four stages. */
    .l1.card{ animation-name:travel1; animation-duration:7s; }
    .l1 .lbl{ animation-duration:7s; }

    /* Lane 2 — order-2205, started mid-cycle (negative delay) so it visibly runs at its own
       pace rather than in lockstep with lane 1. */
    .l2.card{ animation-name:travel1; animation-duration:8.4s; animation-delay:-4.2s; }
    .l2 .lbl{ animation-duration:8.4s; animation-delay:-4.2s; }

    /* Lane 3 — order-9930, shares lane 2's bucket but fails at the relay stage: stalls there
       (travel-poison never reaches stage 4) while lanes 1 and 2 keep moving. */
    .l3.card{ animation-name:travel-poison; animation-duration:9s; }
    .l3 .lbl{ animation-duration:9s; }

    /* stroke and transform share one keyframes block on purpose: a paused/mid-frame render must
       never show a color already drifting toward the next stage's color while position holds
       still, so every color change lands on the same stop as the position change that starts it.
       stroke is set here (on the .card group) rather than as a presentation attribute on the
       <rect>, so the animated value actually cascades down instead of being shadowed by a
       directly-set attribute on the rect itself.
       stroke is also re-declared at 96%/100%, repeating the same color set at 74%/54%: leaving
       it unmentioned from the color change onward (relying on the engine to just hold the last
       value, which is how every other property here behaves) let it silently drop to "none"
       partway through the final stretch in this renderer — reproduced at multiple durations, so
       it's not a rounding fluke. Always restate stroke at the last keyframe explicitly. */
    @keyframes travel1{
      0%   { transform:translateX(0);    opacity:0; stroke:#212B3B; }
      3%   { opacity:1; }
      16%  { transform:translateX(0);    stroke:#212B3B; }
      18%  { transform:translateX(296px); stroke:#7E8CA8; }
      50%  { transform:translateX(296px); stroke:#7E8CA8; }
      54%  { transform:translateX(593px); stroke:#D8D000; }
      72%  { transform:translateX(593px); stroke:#D8D000; }
      74%  { transform:translateX(890px); stroke:#12B412; }
      96%  { opacity:1; stroke:#12B412; }
      100% { transform:translateX(890px); opacity:0; stroke:#12B412; }
    }
    @keyframes travel-poison{
      0%   { transform:translateX(0);    opacity:0; stroke:#212B3B; }
      3%   { opacity:1; }
      16%  { transform:translateX(0);    stroke:#212B3B; }
      18%  { transform:translateX(296px); stroke:#7E8CA8; }
      50%  { transform:translateX(296px); stroke:#7E8CA8; }
      54%  { transform:translateX(593px); stroke:#E03A1A; }
      96%  { opacity:1; stroke:#E03A1A; }
      100% { transform:translateX(593px); opacity:0; stroke:#E03A1A; }
    }

    @keyframes lblCommit  { 0%,14%{opacity:1;} 20%,100%{opacity:0;} }
    @keyframes lblPending { 0%,14%{opacity:0;} 20%,50%{opacity:1;} 56%,100%{opacity:0;} }
    @keyframes lblInflight{ 0%,52%{opacity:0;} 58%,70%{opacity:1;} 76%,100%{opacity:0;} }
    @keyframes lblDone    { 0%,72%{opacity:0;} 78%,94%{opacity:1;} 100%{opacity:0;} }
    @keyframes lblBlocked { 0%,52%{opacity:0;} 58%,100%{opacity:1;} }

    .lbl.commit  { animation-name:lblCommit;   fill:#C6D0E0; }
    .lbl.pending { animation-name:lblPending;  fill:#7E8CA8; }
    .lbl.inflight{ animation-name:lblInflight; fill:#D8D000; }
    .lbl.done    { animation-name:lblDone;     fill:#12B412; }
    .lbl.blocked { animation-name:lblBlocked;  fill:#E03A1A; }

    @media (prefers-reduced-motion: reduce){
      .card, .lbl{ animation-duration:32s !important; }
    }
    ]]>
  </style>

  <rect x="0" y="0" width="1320" height="560" rx="18" fill="#080A0F"/>

  <!-- ── stage header ─────────────────────────────────────────────────── -->
  <g font-size="15" font-weight="700" fill="#7E8CA8" text-anchor="middle">
    <circle cx="284" cy="42" r="13" fill="none" stroke="#212B3B" stroke-width="1.5"/>
    <text x="284" y="47" class="mono">1</text>
    <text x="284" y="72" fill="#C6D0E0" font-size="16" font-weight="600">Commit</text>

    <circle cx="580" cy="42" r="13" fill="none" stroke="#212B3B" stroke-width="1.5"/>
    <text x="580" y="47" class="mono">2</text>
    <text x="580" y="72" fill="#C6D0E0" font-size="16" font-weight="600">tandem_outbox</text>

    <circle cx="877" cy="42" r="13" fill="none" stroke="#212B3B" stroke-width="1.5"/>
    <text x="877" y="47" class="mono">3</text>
    <text x="877" y="72" fill="#C6D0E0" font-size="16" font-weight="600">Relay claims</text>

    <circle cx="1174" cy="42" r="13" fill="none" stroke="#212B3B" stroke-width="1.5"/>
    <text x="1174" y="47" class="mono">4</text>
    <text x="1174" y="72" fill="#C6D0E0" font-size="16" font-weight="600">Kafka publish</text>
  </g>
  <line x1="40" y1="92" x2="1280" y2="92" stroke="#212B3B" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ── lane 1 — order-4471 ──────────────────────────────────────────── -->
  <g>
    <text x="40" y="150" class="mono" font-size="15" fill="#FFFFFF">order-4471</text>
    <text x="40" y="170" font-size="12.5" fill="#7E8CA8">bucket 42</text>
    <line x1="220" y1="160" x2="1240" y2="160" stroke="#212B3B" stroke-width="1"/>
    <circle cx="284" cy="160" r="3" fill="#212B3B"/><circle cx="580" cy="160" r="3" fill="#212B3B"/>
    <circle cx="877" cy="160" r="3" fill="#212B3B"/><circle cx="1174" cy="160" r="3" fill="#212B3B"/>
    <g class="l1 card">
      <rect x="209" y="135" width="150" height="50" rx="10" fill="#161C28" stroke-width="2"/>
      <g class="mono" font-size="16" font-weight="600" text-anchor="middle">
        <text x="284" y="166" class="lbl commit">commit</text>
        <text x="284" y="166" class="lbl pending">PENDING</text>
        <text x="284" y="166" class="lbl inflight">IN_FLIGHT</text>
        <text x="284" y="166" class="lbl done">DONE</text>
      </g>
    </g>
  </g>

  <!-- ── lane 2 — order-2205 ──────────────────────────────────────────── -->
  <g>
    <text x="40" y="290" class="mono" font-size="15" fill="#FFFFFF">order-2205</text>
    <text x="40" y="310" font-size="12.5" fill="#7E8CA8">bucket 187</text>
    <line x1="220" y1="300" x2="1240" y2="300" stroke="#212B3B" stroke-width="1"/>
    <circle cx="284" cy="300" r="3" fill="#212B3B"/><circle cx="580" cy="300" r="3" fill="#212B3B"/>
    <circle cx="877" cy="300" r="3" fill="#212B3B"/><circle cx="1174" cy="300" r="3" fill="#212B3B"/>
    <g class="l2 card">
      <rect x="209" y="275" width="150" height="50" rx="10" fill="#161C28" stroke-width="2"/>
      <g class="mono" font-size="16" font-weight="600" text-anchor="middle">
        <text x="284" y="306" class="lbl commit">commit</text>
        <text x="284" y="306" class="lbl pending">PENDING</text>
        <text x="284" y="306" class="lbl inflight">IN_FLIGHT</text>
        <text x="284" y="306" class="lbl done">DONE</text>
      </g>
    </g>
  </g>

  <!-- ── lane 3 — order-9930, poisoned: stalls at stage 3 ────────────── -->
  <g>
    <text x="40" y="430" class="mono" font-size="15" fill="#E03A1A">order-9930</text>
    <text x="40" y="450" font-size="12.5" fill="#7E8CA8">bucket 187</text>
    <line x1="220" y1="440" x2="1240" y2="440" stroke="#212B3B" stroke-width="1"/>
    <circle cx="284" cy="440" r="3" fill="#212B3B"/><circle cx="580" cy="440" r="3" fill="#212B3B"/>
    <circle cx="877" cy="440" r="3" fill="#212B3B"/><circle cx="1174" cy="440" r="3" fill="#212B3B"/>
    <g class="stack" fill="#0D1119" stroke="#212B3B" stroke-width="1.5">
      <rect x="560" y="446" width="24" height="16" rx="4"/>
      <rect x="566" y="440" width="24" height="16" rx="4"/>
      <rect x="572" y="434" width="24" height="16" rx="4"/>
    </g>
    <text x="530" y="422" font-size="12" fill="#7E8CA8" text-anchor="end">+3 queued, same aggregate</text>
    <g class="l3 card">
      <rect x="209" y="415" width="150" height="50" rx="10" fill="#161C28" stroke-width="2"/>
      <g class="mono" font-size="16" font-weight="600" text-anchor="middle">
        <text x="284" y="446" class="lbl commit">commit</text>
        <text x="284" y="446" class="lbl pending">PENDING</text>
        <text x="284" y="446" class="lbl blocked">FAILED</text>
      </g>
    </g>
  </g>

  <!-- ── footer ───────────────────────────────────────────────────────── -->
  <text x="660" y="520" text-anchor="middle" font-size="17" fill="#5C6B87">a failure blocks only its own aggregate &#8212; order-2205 shares its bucket and keeps flowing</text>
</svg>
