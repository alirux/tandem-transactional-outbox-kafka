[versions]
junit = "6.1.1"
assertj = "3.27.7"
postgresql = "42.7.12"
# Spring modules compile once against the lowest supported Boot 3.x line (LLD-spring-config §1.1);
# the three-line matrix (§1.2) re-runs the unit tests against the latest Boot 3.x patch (Framework
# 6.2.x, otherwise never exercised between the 6.1.x baseline and the 7.x line) and a Boot 4.x line
# too. All three keep Java 17. Nothing bumps any of these three automatically (the repository runs no
# Dependabot version updates at all): each is a deliberate compatibility-contract decision, not a
# routine bump. See LLD-spring-config §1.2.1.
spring-boot = "3.3.13"
spring-boot-v3-latest = "3.5.16"
spring-boot-v4 = "4.1.1"
# kafka-clients aligned to the version cloudevents-kafka targets (binding compatibility).
kafka = "3.9.2"
# tandem-micrometer's own baseline — not tied to any Spring BOM (the module has no Spring dependency
# at all). Matches what Boot 3.3.13 manages; Boot 4.1.0 manages 1.17.0, same major (LLD-micrometer §1).
micrometer = "1.13.15"
# Not a dependency Tandem declares — only a version floor for what kafka-clients drags in.
# kafka-clients 3.9.2 resolves lz4-java 1.10.1, which carries a moderate advisory (the native
# XXHash bindings can crash the JVM on out-of-range byte-array arguments), fixed in 1.11.1.
# Not reachable through Kafka's compression usage, but tandem-kafka is published, so consumers
# inherit the flagged coordinate on their runtime classpath. Constrained up in tandem-kafka/build.gradle.kts.
lz4 = "1.11.1"
cloudevents = "4.1.1"
# tandem-tracing-otel's own baseline: the OpenTelemetry release Spring Boot 3.3.13 manages, i.e. the
# same baseline generation the rest of this project compiles against (LLD-micrometer §1's rule). The
# pin is deliberately LOW, not latest: the OTel SDK on an application's classpath works with an API
# at or below its own version, never above it, so compiling against an old stable 1.x API is what
# lets any current SDK bind at runtime — Gradle resolves to whichever is higher, which is the
# application's. Only the API is redistributed; the SDK is the application's own choice.
opentelemetry = "1.38.0"
# Build-time only: generates the flat schema/postgres/tandem-baseline.sql from the changelog that is
# now the schema's source of truth (LLD-jdbc §6). Runs on an isolated `liquibase` configuration in
# tandem-jdbc, so it never reaches a published POM — Tandem ships the changelog, it does not run
# migrations, and no adopter inherits Liquibase.
liquibase = "4.32.0"
testcontainers = "1.21.4"
# Not a dependency Tandem declares — only a version floor for what Testcontainers drags in.
# Testcontainers 1.21.4 (its newest release) still resolves commons-compress 1.24.0, which carries
# two moderate DoS advisories (DUMP infinite loop, Pack200 OOM). Neither is reachable through
# Testcontainers' tar-only usage, but tandem-test is published, so consumers inherit the flagged
# coordinate on their runtime classpath. Constrained up in tandem-test/build.gradle.kts.
commons-compress = "1.28.0"
# Not dependencies Tandem declares: only version floors for coordinates that a pinned dependency drags
# in at a flagged version, constrained up where they appear (same pattern as lz4 and commons-compress
# above). None of them reaches a published POM. Tomcat, Log4j and the Jackson 2 line come from the Boot
# 3.3.x baseline BOM, on the sample app's runtime and on compile/test classpaths; Rhino comes from
# swagger-request-validator's JSON-schema validator (test-only); commons-lang3 comes from the isolated
# `liquibase` configuration that generates the baseline SQL at build time. Each floor can be dropped
# once the dependency that pulls it ships the patched version itself.
# Tomcat: the advisories are fixed in 10.1.58, a version Apache never published, so the floor is the
# first release above it that exists.
tomcat = "10.1.60"
log4j = "2.25.5"
# Jackson 2: the whole BOM rather than the flagged artifact alone, so the family stays aligned.
jackson = "2.21.4"
rhino = "1.7.14.1"
commons-lang3 = "3.18.0"
# Benchmark-only (leaf app, not part of any published library footprint).
hdrhistogram = "2.2.2"
hikaricp = "5.1.0"
# slf4j-api is already a runtime-scope transitive of kafka-clients (1.7.36); declaring it
# explicitly at a current version only makes it visible at compile time (HLD-logging.md §2.2)
# and does not add a new dependency to the relay-side footprint.
slf4j = "2.0.16"
# spring-web/spring-webmvc declare this as an optional/provided dependency (Gradle does not resolve
# it transitively), yet MockMvc needs the real Servlet API classes on the test classpath. 6.0.x
# matches the Servlet level Spring Framework 6.1.x (Boot 3.3.13's baseline) targets.
jakarta-servlet = "6.0.0"
# OpenAPI conformance testing (HLD-admin-api §5). Pinned to the pre-rename artifact
# (com.atlassian.oai:swagger-request-validator-core) at its last release under that name: the
# renamed 3.0.0 line (com.atlassian.oai:openapi-request-validator-core) compiles to Java 21 class
# files and cannot load under this project's Java 17 toolchain (verified: class file major version
# 65 vs the 61 our compiler accepts), while 2.46.1 targets Java 8 bytecode and is otherwise the
# identical library (same groupId, same com.atlassian.oai.validator.* packages) one release before
# the rename. Only the core artifact is used — its -mockmvc module is separately pinned to
# javax.servlet/Spring 5 (checked against its POM) and cannot run on our Jakarta/Spring 6 baseline
# regardless of version — behind a small hand-written Jakarta-based Request/Response adapter
# (OpenApiConformance, test-only).
openapi-request-validator = "2.46.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
# liquibase-core declares picocli optional, so its command-line entry point does not resolve without
# it. Version left to liquibase-core's own POM, which pins the line its CLI is built against.
picocli = { module = "info.picocli:picocli" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
cloudevents-core = { module = "io.cloudevents:cloudevents-core", version.ref = "cloudevents" }
cloudevents-kafka = { module = "io.cloudevents:cloudevents-kafka", version.ref = "cloudevents" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
# Benchmark-only: the registry the metrics dashboard demo scrapes from (LLD-benchmark §6.3). Never a
# dependency of tandem-micrometer itself, which stays registry-agnostic.
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
# The distributed-tracing API the Spring modules bridge to (HLD-tracing.md §5). No version of its own:
# managed by the already-imported Spring Boot BOM, so each line of the compatibility matrix resolves the
# micrometer-tracing release its own Boot generation ships (1.3.x / 1.5.x / 1.7.x). The API those releases
# expose to this project — Tracer, Propagator, Span, Span.Builder, TraceContext, CurrentTraceContext — is
# byte-identical across them (verified with javap), which is what lets one artifact serve every line.
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
# Test-only: a real tracer/propagator pair, so the bridge is exercised against a genuine W3C traceparent
# and real exported spans rather than a hand-written stand-in.
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
# The tracing API tandem-tracing-otel bridges to — the one OpenTelemetry coordinate Tandem
# redistributes (the SDK stays the application's choice, as it is with any OTel instrumentation).
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
# Never published: gives the version-less SDK entries below their versions where no Spring Boot BOM is
# in play — tandem-tracing-otel's tests, and tandem-benchmark's tracing demo, which needs a real SDK
# because an adapter alone exports nothing.
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
# Benchmark-only: ships the spans of the tracing demo (§6.4) to its Tempo container over OTLP.
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
# Test-only, tandem-spring-producer: a working MDCAdapter (slf4j-simple's is NOPMDCAdapter — a true
# no-op, verified empirically) is needed to test MDC-based correlation-id capture (HLD-tracing.md §9).
# No version of its own: managed by the already-imported Spring Boot BOM, matching every other
# Spring-line coordinate below.
logback-classic = { module = "ch.qos.logback:logback-classic" }

# Spring: the BOM aligns every module version; the individual coordinates carry no version of their own.
# spring-boot-dependencies-v3-latest and -v4 are the same BOM at the latest-3.x and 4.x lines, each
# used only by its own matrix test task (bootLatestThreeTest / bootFourTest).
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-dependencies-v3-latest = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot-v3-latest" }
spring-boot-dependencies-v4 = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot-v4" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
# @AutoConfigureMockMvc lives here — a real WebApplicationContext-backed MockMvc, unlike
# MockMvcBuilders.standaloneSetup's bare one (the two differ in how they resolve @ExceptionHandler
# advice precedence across multiple beans; see TandemAdminEndToEndTest).
spring-boot-test-autoconfigure = { module = "org.springframework.boot:spring-boot-test-autoconfigure" }
spring-test = { module = "org.springframework:spring-test" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-aspects = { module = "org.springframework:spring-aspects" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
# spring-web carries the REST annotations (@RestController, @ExceptionHandler, ResponseEntity, ...);
# spring-webmvc (the Servlet dispatch machinery) is only needed on the test classpath, for MockMvc —
# a consuming application's own spring-boot-starter-web brings it at runtime (LLD-admin-api).
spring-web = { module = "org.springframework:spring-web" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
# Managed by the Spring Boot BOM (platform(libs.spring.boot.dependencies)) — required for MockMvc's
# jsonPath() result matcher.
json-path = { module = "com.jayway.jsonpath:json-path" }
openapi-request-validator-core = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "openapi-request-validator" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
# Registers java.time (de)serialization — a Spring Boot web app always carries this transitively via
# spring-boot-starter-json, so it is compileOnly here too, same discipline as jackson-databind itself.
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
# The ONLY Jackson artifact tandem-admin compiles against. Jackson 2 (com.fasterxml.jackson.databind)
# and Jackson 3 (tools.jackson) share this annotation module — a stock Spring Boot 4 web application
# carries Jackson 3 plus this, and nothing of Jackson 2's databind, so naming a databind type in an
# admin bean signature stops the context from starting there (LLD-spring-config §1.3).
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
# Jackson 3, for the jacksonThreeTest source set only: it represents a stock Boot 4 classpath, which
# the Jackson-2-flavoured bootFourTest deliberately does not.
jackson3-databind = { module = "tools.jackson.core:jackson-databind" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
# Released in lockstep with tomcat-embed-core, constrained together so the three never diverge.
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j" }
# Imported as a platform, not declared as a dependency: it raises the managed Jackson 2 version above
# what the Boot 3.3.x baseline BOM pins, and contributes no jar of its own.
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }

hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
