openapi: 3.0.3
info:
  title: Case
  version: "1"
paths:
  /items:
    get:
      description: Lists the items, newest first.
      parameters:
        - name: after
          in: query
          schema:
            type: string
            maxLength: 64
            default: ""
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  note:
                    type: string
                    maxLength: 100
                  status:
                    type: string
                    enum: [ACTIVE, PAUSED]
                  total:
                    type: integer
                    default: 0
  /items/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One item.
