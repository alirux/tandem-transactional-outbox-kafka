# The frozen contract with aggregateId required, reformatted: every key sorted, indented by four,
# and every long string wrapped at another width.

components:
    responses:
        CoordinationModeUnsupported:
            content:
                application/problem+json:
                    example:
                        detail: Per-bucket relay control requires LEASE
                            coordination; this relay runs SINGLE
                        status: 409
                        title: Not available under this relay coordination
                            mode
                        type: https://tandem.codingful.com/problems/relay-coordination-unsupported
                    schema:
                        $ref: '#/components/schemas/ProblemDetail'
            description: 'The operation needs per-bucket coordination state,
                which only LEASE coordination maintains, and the relay this
                database serves runs under SINGLE. Not a failure and not
                a transient condition - the operation is inapplicable to
                this deployment''s static configuration (tandem.relay.coordination).
                The detail names the mode that was detected.

                '
        InternalServerError:
            content:
                application/problem+json:
                    example:
                        status: 500
                        title: Unexpected internal error
                        type: https://tandem.codingful.com/problems/internal-error
                    schema:
                        $ref: '#/components/schemas/ProblemDetail'
            description: Unexpected internal error
        InvalidParameter:
            content:
                application/problem+json:
                    example:
                        status: 400
                        title: Invalid request parameter
                        type: https://tandem.codingful.com/problems/invalid-parameter
                    schema:
                        $ref: '#/components/schemas/ProblemDetail'
            description: A query or path parameter could not be parsed (e.g.
                an unknown status name, a non-numeric id or cursor)
        NotFound:
            content:
                application/problem+json:
                    example:
                        status: 404
                        title: Resource not found
                        type: https://tandem.codingful.com/problems/not-found
                    schema:
                        $ref: '#/components/schemas/ProblemDetail'
            description: Resource not found
        Unauthorized:
            content:
                application/problem+json:
                    example:
                        status: 401
                        title: Missing or invalid credentials
                        type: https://tandem.codingful.com/problems/unauthorized
                    schema:
                        $ref: '#/components/schemas/ProblemDetail'
            description: Missing or invalid credentials
    schemas:
        BucketSelector:
            properties:
                bucket:
                    description: 'When omitted, the action applies to the
                        whole relay - the only form available under SINGLE
                        coordination. Naming a bucket requires LEASE, since
                        per-bucket state lives on the tandem_bucket_lease
                        row that only LEASE maintains and reads; under SINGLE
                        the request returns 409 rather than accepting a
                        pause the relay would never act on. Under LEASE,
                        a bucket outside [0, bucketCount) returns 404.

                        '
                    nullable: true
                    type: integer
            type: object
        BucketStatus:
            properties:
                bucket:
                    type: integer
                covered:
                    description: Whether the bucket has a live owner
                    type: boolean
                lagAgeSeconds:
                    description: Age of the oldest PENDING row in this bucket,
                        in seconds
                    nullable: true
                    type: number
                leaseUntil:
                    format: date-time
                    nullable: true
                    type: string
                owner:
                    description: Worker id holding the bucket lease; null
                        when unowned
                    nullable: true
                    type: string
                paused:
                    description: 'Whether this bucket is deliberately paused
                        (via POST /relay/pause with a bucket selector).
                        The owning worker keeps renewing its lease while
                        paused - covered can be true even when paused is
                        true. Distinguishes an intentionally-idle bucket
                        from a genuinely stalled one when pendingCount/lagAgeSeconds
                        is growing.

                        '
                    type: boolean
                pendingCount:
                    format: int64
                    type: integer
            required:
            - bucket
            - covered
            - paused
            - pendingCount
            type: object
        DiscardRequest:
            properties:
                acknowledgeOrderingBreak:
                    description: Must be true - confirms the operator accepts
                        the per-aggregate ordering break
                    type: boolean
                reason:
                    description: Free-text reason, recorded for audit
                    type: string
            required:
            - acknowledgeOrderingBreak
            type: object
        OutboxEntry:
            description: 'One entry in the outbox: the message together
                with its delivery state. This is the API''s own representation
                and is deliberately NOT the library''s internal model -
                do not assume the two evolve together.

                '
            properties:
                aggregateId:
                    type: string
                aggregateType:
                    type: string
                attempts:
                    type: integer
                correlationId:
                    description: 'Correlation id captured when the message
                        was written, from its own indexed column - so it
                        is present in the list view too, where headers are
                        not read at all. Null for messages written with
                        trace/correlation propagation disabled.

                        '
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                discardReason:
                    description: Operator-supplied reason recorded when
                        this message was discarded (DISCARDED only)
                    nullable: true
                    type: string
                headers:
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
                id:
                    format: int64
                    type: integer
                lastError:
                    nullable: true
                    type: string
                lockedBy:
                    nullable: true
                    type: string
                lockedUntil:
                    format: date-time
                    nullable: true
                    type: string
                nextAttemptAt:
                    format: date-time
                    nullable: true
                    type: string
                payload:
                    description: Present only in single-message detail,
                        omitted in list view
                    nullable: true
                    oneOf:
                    -   type: object
                    -   type: string
                replays:
                    description: 'How many times an operator has replayed
                        this message, 0 for one never replayed. Unlike attempts,
                        which is the delivery budget of the current round
                        and is reset by a replay, this counts for the lifetime
                        of the row - it is the audit trail of a replay on
                        the row itself, rather than only in the admin log.
                        Deliberately NOT required: an admin instance older
                        than this field simply omits it, which a mixed-version
                        rollout must tolerate.

                        '
                    type: integer
                seq:
                    description: 'The aggregate''s sequence number, absent
                        when the message was written without one. A producer
                        chooses per message whether to supply a number,
                        let Tandem assign one, or store none at all; only
                        the first two put a value here. Absent is not zero
                        - a client must not substitute one, because a plausible
                        number is worse than a missing field.

                        '
                    format: int64
                    nullable: true
                    type: integer
                status:
                    $ref: '#/components/schemas/OutboxStatus'
                type:
                    description: "CloudEvents event type, e.g. com.acme.order.placed\
                        \ (nullable; HLD \xA75.1)"
                    nullable: true
                    type: string
            required:
            - id
            - aggregateId
            - aggregateType
            - status
            - attempts
            - createdAt
            type: object
        OutboxEntryPage:
            description: 'One page of search results plus the cursor for
                the next one. "Page" means a page of results, NOT a page
                number - this API paginates by cursor only (there is no
                page or offset parameter), so pages are traversed forward
                and cannot be jumped to.

                '
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/OutboxEntry'
                    type: array
                nextCursor:
                    description: Pass as cursor to fetch the next page;
                        null when no more
                    nullable: true
                    type: string
            required:
            - items
            type: object
        OutboxStatus:
            enum:
            - PENDING
            - IN_FLIGHT
            - DONE
            - FAILED
            - DISCARDED
            type: string
        OutboxSummary:
            properties:
                counts:
                    description: Row count per status
                    properties:
                        DISCARDED:
                            format: int64
                            type: integer
                        DONE:
                            format: int64
                            type: integer
                        FAILED:
                            format: int64
                            type: integer
                        IN_FLIGHT:
                            format: int64
                            type: integer
                        PENDING:
                            format: int64
                            type: integer
                    type: object
                lagAgeSeconds:
                    description: Age of the oldest PENDING row, in seconds
                    type: number
                lagCount:
                    description: Number of PENDING rows
                    format: int64
                    type: integer
            required:
            - counts
            - lagCount
            - lagAgeSeconds
            type: object
        ProblemDetail:
            additionalProperties: true
            description: 'RFC 9457 Problem Details. Returned as media type
                application/problem+json. Extension members beyond the standard
                fields are permitted.

                '
            properties:
                detail:
                    description: Human-readable explanation specific to
                        this occurrence
                    type: string
                instance:
                    description: URI reference identifying the specific
                        occurrence
                    format: uri-reference
                    type: string
                status:
                    description: HTTP status code
                    type: integer
                title:
                    description: Short, human-readable summary of the problem
                        type
                    type: string
                type:
                    description: 'Canonical problem-type URI. Tandem always
                        sets a stable https://tandem.codingful.com/problems/{slug}
                        URL, never about:blank. The {slug} (kebab-case)
                        is the stable machine identifier consumers match
                        on; it never changes once published. Each URL resolves
                        to a human-readable page documenting the problem
                        type.

                        '
                    format: uri-reference
                    type: string
            type: object
        RelayStatus:
            properties:
                bucketCount:
                    description: Total virtual buckets B (fixed)
                    type: integer
                state:
                    description: 'DOWN means no relay instance has heartbeated
                        within the last few reclaimIntervals (5s by default,
                        so DOWN typically surfaces within ~15s of the last
                        instance stopping) - true under both SINGLE and
                        LEASE coordination, since every relay instance touches
                        this heartbeat regardless of mode. A relay that
                        was PAUSED before going down still reports DOWN,
                        not PAUSED: "is anything running at all" takes priority
                        over the desired-state flag.

                        '
                    enum:
                    - RUNNING
                    - PAUSED
                    - DOWN
                    type: string
                uncoveredBuckets:
                    description: 'Buckets with PENDING rows but no live
                        owner (coverage stall). Always 0 under SINGLE coordination,
                        which owns every bucket in-process and so has no
                        coverage to stall - the same reason the relay''s
                        own bucket.uncovered gauge reports nothing in that
                        mode.

                        '
                    type: integer
                workers:
                    description: 'Live relay instances, counted from tandem_relay_member.
                        Always 0 under SINGLE coordination, which does not
                        register presence there - it does NOT mean no relay
                        is running; check state instead, which covers SINGLE
                        too via a separate, lighter heartbeat.

                        '
                    type: integer
            required:
            - state
            - bucketCount
            - uncoveredBuckets
            - workers
            type: object
        ReplayRequest:
            description: 'At least one of aggregateId / aggregateType /
                id range / statuses must be present - a selector-less request
                would replay the entire outbox and is rejected (400 replay-no-selector).

                '
            properties:
                aggregateId:
                    type: string
                aggregateType:
                    type: string
                dryRun:
                    default: false
                    description: When true, returns the matched count without
                        modifying anything
                    type: boolean
                fromId:
                    format: int64
                    type: integer
                statuses:
                    description: 'Which statuses are eligible for replay
                        (only DONE/FAILED are valid). When omitted alongside
                        another selector, both DONE and FAILED rows matching
                        that selector are replayed.

                        '
                    items:
                        $ref: '#/components/schemas/OutboxStatus'
                    type: array
                toId:
                    format: int64
                    type: integer
            type: object
        ReplayResult:
            properties:
                dryRun:
                    type: boolean
                matched:
                    description: Rows matching the criteria
                    format: int64
                    type: integer
                replayed:
                    description: Rows reset to PENDING (0 on dryRun)
                    format: int64
                    type: integer
            required:
            - matched
            - replayed
            - dryRun
            type: object
        WorkerInfo:
            properties:
                bucketCount:
                    type: integer
                lastHeartbeat:
                    format: date-time
                    type: string
                workerId:
                    type: string
            required:
            - workerId
            - bucketCount
            type: object
    securitySchemes:
        apiKeyAuth:
            in: header
            name: X-API-Key
            type: apiKey
        bearerAuth:
            scheme: bearer
            type: http
info:
    description: 'Operational REST API for the Tandem transactional-outbox
        library. Exposes read access to outbox state, plus operational actions
        (replay, discard, relay pause/resume) useful to operators.


        This contract is the source of truth (API-first): the implementation
        must conform to it, and any API change starts here. The API is optional
        and off by default; when enabled it MUST be secured by the host
        application - Tandem ships the endpoints, not the authentication.


        Compatibility. Within a major version (/v1) the contract evolves
        ADDITIVELY for BACKWARD compatibility: only new optional fields,
        endpoints, or operations are added; fields are never removed, renamed,
        retyped, or made required, value ranges are never narrowed, and
        error `type` slugs never change. Breaking changes ship under a new
        major version (/v2) alongside /v1. For FORWARD compatibility, consumers
        MUST be tolerant readers: ignore unknown response fields and unknown
        enum values, and never reject a payload for containing extra properties.
        Response schemas are intentionally open (no `additionalProperties:
        false`); do NOT configure strict validation that rejects unknown
        fields - it breaks consumers as soon as the provider adds a field.

        '
    license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0
    title: Tandem Admin API
    version: 1.0.0
openapi: 3.0.3
paths:
    /outbox/messages:
        get:
            operationId: searchOutboxMessages
            parameters:
            -   in: query
                name: status
                schema:
                    $ref: '#/components/schemas/OutboxStatus'
            -   in: query
                name: aggregateId
                required: true
                schema:
                    type: string
            -   in: query
                name: aggregateType
                schema:
                    type: string
            -   description: CloudEvents event type, e.g. com.acme.order.placed
                in: query
                name: type
                schema:
                    type: string
            -   in: query
                name: createdFrom
                schema:
                    format: date-time
                    type: string
            -   in: query
                name: createdTo
                schema:
                    format: date-time
                    type: string
            -   description: 'Exact match on the message''s correlation
                    id - the incident-time lookup, since the correlation
                    id usually originates outside this application (an inbound
                    request header, a consumed message) and is often the
                    only identifier available when an investigation starts.
                    One correlation id normally matches MANY messages, across
                    several aggregates, so combine it with status to narrow
                    the page.

                    '
                in: query
                name: correlationId
                schema:
                    type: string
            -   in: query
                name: limit
                schema:
                    default: 50
                    maximum: 500
                    minimum: 1
                    type: integer
            -   description: Opaque cursor from a previous page (afterId)
                in: query
                name: cursor
                schema:
                    type: string
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OutboxEntryPage'
                    description: Page of messages (payload omitted in list
                        view)
                '400':
                    $ref: '#/components/responses/InvalidParameter'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Search outbox messages
            tags:
            - Outbox
    /outbox/messages/{id}:
        get:
            operationId: getOutboxMessage
            parameters:
            -   in: path
                name: id
                required: true
                schema:
                    format: int64
                    type: integer
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OutboxEntry'
                    description: Message
                '400':
                    $ref: '#/components/responses/InvalidParameter'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Get a single outbox message (full detail incl. payload
                and headers)
            tags:
            - Outbox
    /outbox/messages/{id}/discard:
        post:
            description: 'Marks a FAILED message as permanently discarded
                so the relay stops blocking the aggregate. WARNING: discarding
                skips an event and therefore breaks per-aggregate happens-before
                ordering for that aggregate - acknowledgeOrderingBreak must
                be true.

                '
            operationId: discardMessage
            parameters:
            -   in: path
                name: id
                required: true
                schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DiscardRequest'
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OutboxEntry'
                    description: Discarded; returns the updated message
                '400':
                    content:
                        application/problem+json:
                            example:
                                status: 400
                                title: Ordering-break acknowledgement is
                                    required to discard
                                type: https://tandem.codingful.com/problems/ordering-break-not-acknowledged
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                    description: acknowledgeOrderingBreak not set
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    content:
                        application/problem+json:
                            example:
                                status: 409
                                title: Message is not in a discardable state
                                type: https://tandem.codingful.com/problems/message-not-discardable
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                    description: Message is not in a discardable state (must
                        be FAILED)
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Discard a message (abandon delivery)
            tags:
            - Outbox
    /outbox/messages/{id}/replay:
        post:
            description: Resets a DONE or FAILED message to PENDING so the
                relay re-publishes it.
            operationId: replayMessage
            parameters:
            -   in: path
                name: id
                required: true
                schema:
                    format: int64
                    type: integer
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OutboxEntry'
                    description: Replayed; returns the updated message
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    content:
                        application/problem+json:
                            example:
                                status: 409
                                title: Message is not in a replayable state
                                type: https://tandem.codingful.com/problems/message-not-replayable
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                    description: Message is not in a replayable state (must
                        be DONE or FAILED)
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Replay a single message
            tags:
            - Outbox
    /outbox/replay:
        post:
            description: 'Replays all DONE/FAILED messages matching the
                criteria. Supports dryRun to preview the matched count without
                changing anything. At least one selector is required.

                '
            operationId: replayBulk
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplayRequest'
                required: true
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReplayResult'
                    description: Replay result (or dry-run preview)
                '400':
                    content:
                        application/problem+json:
                            example:
                                status: 400
                                title: At least one replay selector is required
                                type: https://tandem.codingful.com/problems/replay-no-selector
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                    description: No selector provided
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Bulk replay by criteria
            tags:
            - Outbox
    /outbox/summary:
        get:
            description: Counts per status plus overall lag metrics. Per-bucket
                lag is at GET /relay/buckets.
            operationId: getOutboxSummary
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OutboxSummary'
                    description: Summary
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Outbox health summary
            tags:
            - Outbox
    /relay/buckets:
        get:
            description: 'Owner, lease, and lag for each virtual bucket.
                Use to spot uncovered (stalled) buckets and hot buckets.
                LEASE coordination only (standalone or embedded-multi-replica):
                SINGLE keeps bucket ownership in-process and never writes
                tandem_bucket_lease, so there is no per-bucket ownership
                to report and the request returns 409 rather than a misleading
                reading.

                '
            operationId: getRelayBuckets
            parameters:
            -   description: Return only buckets that have PENDING rows
                    but no live owner
                in: query
                name: uncoveredOnly
                schema:
                    default: false
                    type: boolean
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/BucketStatus'
                                type: array
                    description: Bucket statuses
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '409':
                    $ref: '#/components/responses/CoordinationModeUnsupported'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Per-bucket ownership and lag
            tags:
            - Relay
    /relay/buckets/{bucket}:
        get:
            description: 'Owner, lease, and lag for one virtual bucket.
                LEASE coordination only, same reasoning as GET /relay/buckets
                - SINGLE returns 409 rather than a misleading reading.

                '
            operationId: getRelayBucket
            parameters:
            -   in: path
                name: bucket
                required: true
                schema:
                    type: integer
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BucketStatus'
                    description: Bucket status
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/CoordinationModeUnsupported'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: A single bucket's ownership and lag
            tags:
            - Relay
    /relay/buckets/{bucket}/release:
        post:
            description: 'Clears the bucket''s ownership lease so another
                worker can claim it. Use when an owner is a zombie (stale
                heartbeat) and the bucket is stalled. LEASE coordination
                only - under SINGLE there is no bucket ownership to release
                and this returns 409.

                '
            operationId: releaseBucket
            parameters:
            -   in: path
                name: bucket
                required: true
                schema:
                    type: integer
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BucketStatus'
                    description: Updated bucket status
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/CoordinationModeUnsupported'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Force-release a bucket for reassignment
            tags:
            - Relay
    /relay/pause:
        post:
            description: 'Each relay instance re-reads the desired state
                on its own control-refresh tick (the relay''s reclaimInterval,
                5s by default), so the effect lags by up to that interval
                - it is not immediate, and a worker mid-dispatch finishes
                what it already claimed. When a bucket is paused, its owning
                worker keeps renewing the bucket''s lease and simply stops
                dispatching sends for it; pause never releases the lease
                (use POST /relay/buckets/{bucket}/release for that). Pausing
                a single bucket requires LEASE coordination and returns
                409 otherwise - see the bucket field on BucketSelector.

                '
            operationId: pauseRelay
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BucketSelector'
                required: false
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RelayStatus'
                    description: Updated relay status
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/CoordinationModeUnsupported'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Pause the relay (optionally a single bucket)
            tags:
            - Relay
    /relay/resume:
        post:
            description: 'Each relay instance re-reads the desired state
                on its own control-refresh tick (the relay''s reclaimInterval,
                5s by default), so the effect lags by up to that interval.
                Resuming a single bucket requires LEASE coordination and
                returns 409 otherwise - see the bucket field on BucketSelector.

                '
            operationId: resumeRelay
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BucketSelector'
                required: false
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RelayStatus'
                    description: Updated relay status
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/CoordinationModeUnsupported'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Resume the relay (optionally a single bucket)
            tags:
            - Relay
    /relay/status:
        get:
            operationId: getRelayStatus
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RelayStatus'
                    description: Relay status
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Relay running state, bucket coverage, and worker count
            tags:
            - Relay
    /relay/workers:
        get:
            description: 'Live relay instances, read from tandem_relay_member.
                LEASE coordination only, which is what registers and renews
                that presence row; under SINGLE nothing writes it, so an
                empty list would read as "no relay alive" when the relay
                is perfectly healthy - the request returns 409 instead.
                Use GET /relay/status for a reading that works in both modes.

                '
            operationId: getRelayWorkers
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/WorkerInfo'
                                type: array
                    description: Active workers
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '409':
                    $ref: '#/components/responses/CoordinationModeUnsupported'
                '500':
                    $ref: '#/components/responses/InternalServerError'
            summary: Active relay workers
            tags:
            - Relay
security:
-   bearerAuth: []
-   apiKeyAuth: []
servers:
-   description: 'Configurable base path + fixed major-version segment.
        Default effective URL: /tandem/admin/v1. A breaking change ships
        under /v2 alongside /v1.

        '
    url: '{basePath}/v1'
    variables:
        basePath:
            default: /tandem/admin
tags:
-   description: Inspect and act on outbox messages (the sends)
    name: Outbox
-   description: Inspect and control the relay
    name: Relay
