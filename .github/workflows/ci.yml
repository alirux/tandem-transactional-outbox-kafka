name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build, test and verify coverage
        run: ./gradlew check :tandem-coverage:aggregatedCoverageReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Upload only the single project-wide aggregated report. It re-maps every module's execution
          # data (unit + integration + e2e) against every module's sources, so cross-module coverage is
          # attributed to the owning class. disable_search stops Codecov from also picking up the
          # per-module reports, which scope coverage to their own sources and would reintroduce
          # mis-attributed 0% entries (e.g. tandem-core's ReplayResult).
          files: ./tools/tandem-coverage/build/reports/jacoco/aggregated/aggregated.xml
          disable_search: true
          flags: java

      - name: Submit dependency graph
        # Only on push to main: fork PRs don't get a token with contents:write, and the
        # dependency graph only needs to track the default branch anyway.
        if: github.event_name == 'push'
        uses: gradle/actions/dependency-submission@v5
        with:
          # Scope the graph to what is redistributed: the runtime classpath of the published
          # modules, and of the relay image (below). Without these two filters the action submits
          # every resolvable configuration of every project, so the alerts are dominated by
          # coordinates nobody downstream ever sees: test-only tooling, compileOnly Spring (never in
          # a published POM), the two extra Boot lines of the compatibility matrix, and the sample
          # app's own server runtime. `runtimeClasspath` is the closest Gradle equivalent of the
          # published POM's compile + runtime scopes, which is exactly the redistributed footprint
          # the project already lists in THIRD-PARTY-NOTICES.md.
          #
          # What this trades away: a vulnerability confined to test or build tooling no longer
          # raises an alert here. That is deliberate, not an oversight. Go is unaffected, since
          # GitHub reads tandem-cli's go.mod files directly rather than through this submission.
          #
          # tandem-relay is unpublished and deliberately NOT in the exclusion below: its runtime
          # classpath is shipped to operators inside the container image, so an alert on it is about
          # something that is redistributed (LLD-relay §10).
          dependency-graph-include-configurations: ^runtimeClasspath$
          dependency-graph-exclude-projects: ^:?tandem-(sample|sample-spring|benchmark|coverage)$

      # The integration tests run the relay's jar; this runs its image (LLD-relay §8.3), so a broken
      # Dockerfile or compose example fails here rather than at release time. It packages the pinned jar
      # `check` has already built, for the runner's architecture only and without pushing, then brings up
      # the compose example: --wait returns once both replicas pass their healthcheck, which is the
      # readiness probe. That exercises the layer extraction, the entrypoint, the non-root user and the
      # example file, which nothing else runs.
      - name: Smoke-test the relay image
        id: relay-image
        run: |
          mapfile -t build_args < <(./gradlew -q :tandem-relay:imageBuildArgs)
          docker build "${build_args[@]}" --tag tandem-relay:local apps/tandem-relay
          docker compose -f apps/tandem-relay/docker-compose.example.yml up --wait --wait-timeout 180
          for port in 8081 8082; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:$port/actuator/health/readiness"
          done
          # A correctly configured start logs nothing at WARN: a warning at every healthy start teaches
          # operators to ignore warnings.
          if docker compose -f apps/tandem-relay/docker-compose.example.yml logs relay-1 relay-2 | grep ' WARN '; then
            exit 1
          fi

      - name: Stop the relay image smoke test
        if: always() && steps.relay-image.outcome != 'skipped'
        run: |
          if [ "${{ steps.relay-image.outcome }}" = failure ]; then
            docker compose -f apps/tandem-relay/docker-compose.example.yml logs --no-color
          fi
          docker compose -f apps/tandem-relay/docker-compose.example.yml down -v

  tandem-cli:
    # tandem-cli is a separate Go module (apps/tandem-cli/go.mod) entirely outside the Gradle
    # build (LLD-cli.md §2) - its own job, its own toolchain, never gated on the build above.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tandem-cli

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/tandem-cli/go.mod
          cache-dependency-path: apps/tandem-cli/go.sum

      - name: Regenerate the Admin API client and fail on drift
        # The committed internal/client/generated.go must match what the current
        # docs/admin-api.openapi.yaml produces (LLD-cli.md §8) - the Go-toolchain
        # equivalent of Specmatic's conformance check for tandem-admin.
        run: |
          make generate
          git diff --exit-code -- internal/client/generated.go

      - name: Regenerate the CLI reference docs and fail on drift
        # The committed docs/cli/*.md must match what the live cobra command tree
        # produces (LLD-cli.md §8) - same drift-gate pattern as the generated client
        # above, so the user manual can never silently fall behind an actual flag/
        # command/description change.
        run: |
          make docs
          git diff --exit-code -- docs/cli

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/tandem-cli/coverage.out
          disable_search: true
          flags: cli
