name: Relay Image Release

# tandem-relay is versioned and released independently of the library (LLD-relay §7.3): its own tag
# prefix, its own workflow, its own version variable. The globs are anchored, so release.yml's v* never
# matches relay-v* and this one never matches v*. Nothing here is irreversible, unlike a Maven Central
# publication, so the whole release is automatic: a failed run is simply run again.
on:
  push:
    tags:
      - 'relay-v*'

permissions:
  contents: write   # the GitHub Release
  packages: write   # the image on GHCR

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/alirux/tandem-relay

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # annotated tag objects, so the tag message is readable below

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # RELAY_VERSION goes to every later step: the build reads it, so the jar that is tested is the jar
      # that ships. Docker tags cannot carry semver build metadata (+...), hence the stricter pattern.
      - name: Extract version from tag
        run: |
          version="${GITHUB_REF_NAME#relay-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME does not carry a version of the form relay-v<major>.<minor>.<patch>[-<pre-release>]" >&2
            exit 1
          fi
          echo "RELAY_VERSION=$version" >> "$GITHUB_ENV"

      # The tagged commit against the pinned library release, before anything is pushed: the jar as it
      # ships, started as a process against a real PostgreSQL and Kafka (Docker is available on
      # ubuntu-latest), and the notices the image will carry checked against that same jar.
      - name: Verify the pinned build
        run: ./gradlew :tandem-relay:pinnedTest :tandem-relay:checkThirdPartyNotices

      - name: Build the jar
        run: ./gradlew :tandem-relay:pinnedBootJar

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag always, latest only for a version without a pre-release suffix: a release
      # candidate must never become what latest pulls. A version tag is never moved, so a run repeated
      # after a later step failed finds the image already there and leaves it as it is. The revision and
      # creation labels are the tagged commit's, which keeps them the same on a repeated run.
      - name: Build and push the image
        run: |
          if docker buildx imagetools inspect "$IMAGE:$RELAY_VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$RELAY_VERSION already exists and is not pushed again"
            exit 0
          fi
          tags=(--tag "$IMAGE:$RELAY_VERSION")
          if [[ "$RELAY_VERSION" != *-* ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          mapfile -t build_args < <(./gradlew -q :tandem-relay:imageBuildArgs)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${build_args[@]}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(git log -1 --format=%cI)" \
            "${tags[@]}" \
            --push \
            tandem-relay

      # The annotated tag's message becomes the release notes, same convention as the other release
      # workflows (AGENTS.md §Releases): its first line is the title, everything below it the body.
      - name: Extract tag message
        id: tag_message
        run: |
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > RELEASE_BODY.md
          echo "title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      # --latest=false: "Latest" is a single repo-wide badge, and the image's release line must not bury
      # the library's newest release on the repository front page (same as the CLI and the connector).
      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${TITLE:-$GITHUB_REF_NAME}" \
            --notes-file RELEASE_BODY.md \
            --latest=false \
            "tandem-relay/build/libs/tandem-relay-$RELAY_VERSION.jar"
        env:
          TITLE: ${{ steps.tag_message.outputs.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
