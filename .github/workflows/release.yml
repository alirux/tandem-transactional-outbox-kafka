name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # annotated tag objects, so the tag message is readable below

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Uploads all published modules to the Central Portal as a *staged* deployment
      # and stops. Publishing to Maven Central is irreversible (a released version can
      # never be deleted or overwritten), so the final "Publish" is done manually from
      # https://central.sonatype.com/publishing after inspecting the deployment.
      # Switch to `publishAndReleaseToMavenCentral` here to release automatically.
      #
      # The com.vanniktech.maven.publish plugin reads credentials/signing from Gradle
      # properties, injected here via their ORG_GRADLE_PROJECT_ env-var form.
      #
      # tandem-rabbitmq is excluded: it carries its own version and publishes only from
      # rabbitmq-release.yml on rabbitmq-v* tags. Left in, its RABBITMQ_VERSION guard would fail
      # this whole run rather than publish it under the library's version.
      - name: Publish to Maven Central (staged)
        run: ./gradlew publishToMavenCentral -x :tandem-rabbitmq:publishToMavenCentral --no-configuration-cache
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # The annotated tag's message becomes the release notes, so they are written
      # once — when tagging — instead of by hand afterwards: its first line is the
      # release title, everything below it the body. A lightweight tag has neither,
      # hence the fallback to the plain tag name.
      - name: Extract tag message
        id: tag_message
        run: |
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > RELEASE_BODY.md
          echo "title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.tag_message.outputs.title || github.ref_name }}
          body_path: RELEASE_BODY.md
          generate_release_notes: true   # appended below the tag message
