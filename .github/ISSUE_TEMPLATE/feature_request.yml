name: Feature request
description: Propose something Tandem should do that it does not do today.
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: The use case
      description: >
        The problem you are trying to solve, rather than the solution you have in mind. A short
        description of the use case is more useful up front than a full design.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: How you work around the absence, and what that costs you.

  - type: dropdown
    id: placement
    attributes:
      label: Where it belongs
      description: >
        Tandem stays simple for the common case: a service on PostgreSQL or MySQL publishing
        ordered events to Kafka. Anything that would make that case harder, slower or more
        confusing in order to serve a minority belongs in an optional module rather than the
        common path. Your best guess is enough; say why in the field below.
      options:
        - The common path, because most users hit this
        - An optional module or adapter, because it serves a subset
        - Not sure
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why there
      description: What makes you place it where you did.
