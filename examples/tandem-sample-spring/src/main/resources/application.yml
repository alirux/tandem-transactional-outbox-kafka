# Keep the sample's own narration (System.out) the star of the console.
spring:
  application:
    name: tandem-sample-spring
  main:
    # Suppress Spring Boot's startup banner so it does not precede the sample's own console output.
    banner-mode: "off"
logging:
  level:
    root: WARN
    # Scoped, not root: WARN keeps Spring's own startup noise out of the demo's console so the
    # sample's own narration (System.out) stays the star of it, while this still surfaces Tandem's
    # own log lines — notably the Admin API's audit log for every write operation (replay, discard,
    # pause, resume, release) — when you drive the running app with the curl commands it prints.
    com.codingful.tandem: INFO

# [DEMO-ONLY] Start the Testcontainers PostgreSQL + Kafka and publish their addresses as properties
# before the context binds, so the DataSource and Tandem's autoconfigurations wire from real properties.
# A real application deletes this and configures spring.datasource / tandem.kafka.producer itself.
context:
  initializer:
    classes: com.codingful.tandem.sample.spring.DemoContainerInitializer

# Tandem's own configuration. The write side binds tandem.outbox.* — here the number of virtual
# buckets, the single value the write side and the relay must agree on and never change after the
# first deployment. It already defaults to 256; it is shown explicitly only to illustrate how Tandem
# is configured. Your IDE offers completion and docs for every tandem.* key from the generated
# spring-configuration-metadata.json.
tandem:
  outbox:
    bucket-count: 256
  # [DEMO-ONLY] Also demonstrates the Admin API's read/replay/discard/relay-control endpoints,
  # off by default otherwise.
  admin:
    enabled: true
  relay:
    # [DEMO-ONLY] Lowered from the 10,000 default so the relay's progress log actually fires
    # during the sample's handful of writes instead of staying silent throughout.
    log-every-rows: 100

---
# [DEMO-ONLY] The "lease" profile (run-lease.sh) demonstrates the Admin API's LEASE-only relay
# endpoints (GET /relay/buckets, GET /relay/workers, POST /relay/buckets/{bucket}/release) against
# a real tandem_bucket_lease/tandem_relay_member, which SINGLE (the default above, and the common
# case) never touches. A faster reclaimInterval just makes the demo's own wait shorter — real
# deployments keep the 5s default.
spring:
  config:
    activate:
      on-profile: lease
tandem:
  relay:
    coordination: LEASE
    reclaim-interval: 2s
