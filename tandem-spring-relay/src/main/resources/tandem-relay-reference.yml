# Tandem — reference configuration for tandem-spring-relay (LLD-spring-config §2).
#
# Every `tandem.*` key this module binds, in one place, with its default. Copy what you need and delete
# the rest: every key shown commented out is already in force at the value noted, so a deployment that
# sets none of them behaves exactly like this file describes.
#
# Only `tandem.kafka.source` has no default — startup fails, naming the key, if it is absent.
# The same IDE completion and hover text comes from the module's generated configuration metadata.

tandem:

  # ----------------------------------------------------------------------------------------------
  # tandem.outbox — the values the write side and the relay MUST agree on.
  # ----------------------------------------------------------------------------------------------
  outbox:
    # tandem.outbox.bucket-count — number of virtual buckets work is sharded over. Default: 256.
    # Baked into every stored row: never change it after the first deployment. The write side must
    # bind the identical value; a divergence fails startup instead of stalling delivery silently.
    bucket-count: 256

  # ----------------------------------------------------------------------------------------------
  # tandem.relay — the relay engine.
  # ----------------------------------------------------------------------------------------------
  relay:
    # tandem.relay.enabled — whether this application runs a relay. Default: true.
    # Set false to load the module without starting a relay (one image, two roles).
    # enabled: true

    # tandem.relay.coordination — SINGLE (default) or LEASE: how concurrent relay instances share
    # buckets. SINGLE assumes one active relay; LEASE lets several instances split the buckets.
    # coordination: SINGLE

    # tandem.relay.instance-id — this instance's unique LEASE owner id, max 64 chars.
    # Default: derived, tandem-<host>-<pid>-<rand>. Set it for stability across restarts.
    # instance-id: tandem-orders-relay-1

    # tandem.relay.bucket-lease — how long a LEASE bucket claim is held. Default: 30s.
    # bucket-lease: 30s

    # tandem.relay.workers-per-instance — worker threads. Default: availableProcessors() * 2.
    # workers-per-instance: 8

    # tandem.relay.poll-interval — ceiling of the idle backoff between empty claims, so what the
    # first row after a quiet stretch waits, and what bounds the idle query load. Default: 100ms.
    # poll-interval: 100ms

    # tandem.relay.poll-interval-floor — where that backoff restarts after a claim that returned
    # rows, so what a row of a live stream waits. Set it equal to poll-interval for a fixed
    # interval. Default: 10ms.
    # poll-interval-floor: 10ms

    # tandem.relay.poll-backoff-factor — how fast the idle backoff climbs from the floor back to
    # poll-interval, one step per empty claim. Must be > 1. Default: 2.0.
    # poll-backoff-factor: 2.0

    # tandem.relay.batch-size — per-shard in-flight window. Default: 100.
    # batch-size: 100

    # tandem.relay.row-lease — per-row claim lease. Default: 60s.
    # Hard invariant: must exceed the producer's effective delivery.timeout.ms (2x recommended),
    # or a row's lease could expire mid-send and the row be delivered twice. Checked at startup.
    # row-lease: 60s

    # tandem.relay.max-attempts — delivery attempts before a row is quarantined. Default: 10.
    # max-attempts: 10

    # tandem.relay.retention — how long DONE rows are kept before cleanup. Default: 14d.
    # retention: 14d

    # tandem.relay.cleanup-batch-size — rows deleted per cleanup pass. Default: 1000.
    # cleanup-batch-size: 1000

    # tandem.relay.reclaim-interval — how often expired row leases are reclaimed. Default: 5s.
    # reclaim-interval: 5s

    # tandem.relay.cleanup-interval — how often DONE rows are cleaned up. Default: 15m.
    # cleanup-interval: 15m

    # tandem.relay.metrics-interval — how often backlog, backlog age and live workers are reported.
    # Default: 10s.
    # metrics-interval: 10s

    # tandem.relay.log-every-rows — per-worker INFO progress log every N dispatch outcomes (ok + ko
    # combined), independent of any metrics adapter. Default: 10000.
    # log-every-rows: 10000

    # tandem.relay.order-violation-detection — whether the relay watches the order it actually
    # publishes per aggregate and reports a violated write-side ordering precondition (an ERROR log
    # plus the order-violation counter). Each row is judged on the ordering it declares: the number
    # the application supplied, or the row's id where it supplied none. On by default, because that
    # violation is otherwise completely silent. Turn it off where writers to one aggregate are
    # serialised by construction: detection is bounded and therefore partial (a relay restart, a
    # LEASE rebalance moving buckets to another instance, or eviction past the 4096
    # most-recently-published aggregates of a worker, loses the watermark), and it holds one entry per
    # tracked aggregate per worker. Default: true.
    # order-violation-detection: true

  # ----------------------------------------------------------------------------------------------
  # tandem.metrics — the tandem-micrometer adapter. Only takes effect when Micrometer and a
  # MeterRegistry bean are on the classpath; a no-op TandemMetrics otherwise ignores these.
  # ----------------------------------------------------------------------------------------------
  metrics:
    # tandem.metrics.max-publish-latency — the publish.latency histogram's ceiling. A latency above
    # it is still recorded (in the +Inf bucket), just without the resolution to place it precisely
    # between finite buckets — and histogram_quantile() then caps its estimate at this ceiling rather
    # than reporting the true, higher value. Default: 5m.
    # max-publish-latency: 5m

  # ----------------------------------------------------------------------------------------------
  # tandem.tracing — instrumented mode. Only takes effect when the application runs Micrometer
  # Tracing (a Propagator bean present); without it the relay emits no span and ignores this.
  # ----------------------------------------------------------------------------------------------
  tracing:
    # tandem.tracing.publish-span — emit one publish span per delivered record, parented to the trace
    # captured on that row at insert time, so a trace shows the outbox dwell and the real send instant
    # instead of a gap. Default: false — explicit only, never turned on just because a tracing library
    # is on the classpath (HLD-tracing.md §9, which also names the span).
    # Builds on the write side's capture: a row carrying no trace context gets no span, rather than an
    # orphan trace holding a publish and nothing about the business operation behind it.
    # publish-span: false

  # ----------------------------------------------------------------------------------------------
  # tandem.kafka — the CloudEvents envelope and the Kafka producer.
  # ----------------------------------------------------------------------------------------------
  kafka:
    # tandem.kafka.source — REQUIRED. The CloudEvents `source` of every published event: the URI
    # identifying this application as the producer. No default.
    source: /orders/service

    # tandem.kafka.default-content-type — `datacontenttype` for a row that stored none.
    # Default: application/json.
    # default-content-type: application/json

    # tandem.kafka.default-data-schema — default CloudEvents `dataschema` URI.
    # Default: unset, omitted from the envelope.
    # default-data-schema: https://schemas.example.com/orders/v1.json

    # tandem.kafka.topic-suffix — appended to the kebab-cased aggregate type to form the topic name,
    # so `OrderLine` publishes to `order-line-topic`. Default: -topic.
    # topic-suffix: -topic

    # tandem.kafka.producer.* — raw Kafka producer properties, passed through. Tandem hardens what
    # protects no-loss and ordering (enable.idempotence, acks, max.in.flight.requests.per.connection)
    # and rejects unsafe overrides at startup. Default: empty.
    producer:
      bootstrap.servers: localhost:9092
      # compression.type: lz4
      # linger.ms: 5
      # security.protocol: SASL_SSL
